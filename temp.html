
<!-- game ratio 1000 x 540  -->

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Road Trip Sim</title>
<style>
  canvas { border:1px solid #d3d3d3; background:#f1f1f1; display:block; margin:16px auto; }
</style>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('ServiceWorker registration successful'))
        .catch(err => console.log('ServiceWorker registration failed:', err));
    });
  }
</script>
</head>
<body onload="startGame()">
<script>
var myGamePiece;
var myObstacles = [];
var trackLines = [];
var track = [];
var myScore;
var distance = 0;
var curvature = 0;

var billboards = [];
var billboardImage = new Image()
billboardImage.src = './billboard.png'; 
var lastBillboardSpawnAt = 0;
var BILLBOARD_SPAWN_GAP = 600; //800
var BILLBOARD_MAX_DEPTH = 1500; //2000

let testPiece = null;

function isGreenSegment(distance){
  return Math.sin(20 * Math.pow(1 - (distance / (myGameArea.canvas.height / 2)), 3) + distance * 0.1) > 0;
}

function spawnBillboard(worldDist){
  if (isGreenSegment(worldDist)){
    billboards.push({ worldDist, baseWidth:100, baseHeight:100, image:billboardImage, color:"transparent" });
    console.log('Spawned billboard at', worldDist);
  }
}

function drawBillboards() {
  var ctx = myGameArea.context;
  var i = 0;
  while (i < billboards.length) {
    var b = billboards[i];
    var depth = b.worldDist - distance;
    if (depth <= 0) { billboards.splice(i, 1); continue; }

    var p = Math.max(0, Math.min(1, 1 - (depth / BILLBOARD_MAX_DEPTH)));
    var screenMiddle = myGameArea.canvas.width / 2 + curvature * 500 * Math.pow((1 - p), 2);
    var screenY = myGameArea.canvas.height/2 + p * (myGameArea.canvas.height/2);
    var scale = Math.max(0.1, 0.2 + (1 - (depth / BILLBOARD_MAX_DEPTH)) * 1.8);
    var bw = b.baseWidth * scale;
    var bh = b.baseHeight * scale;
    var gap = 250 * p + 100;
    var leftEdge = screenMiddle - gap/2;
    var rightEdge = screenMiddle + gap/2;
    // var x = (b.worldDist % 2 === 0) ? leftEdge - bw/2 : rightEdge - bw/2;
    var x = leftEdge - bw - 30;

    if (b.image && b.image.complete) {
        ctx.drawImage(b.image, x, screenY - bh - 10, bw, bh);
    } else {
        ctx.fillStyle = b.color;
        ctx.fillRect(x, screenY - bh - 10, bw, bh);
    }

    if (screenY > myGameArea.canvas.height + 50) { billboards.splice(i, 1); continue; }
    i++;
  }
}

function startGame() {
  myGamePiece = new component(30, 30, "black", 270, 540);
  myGamePiece.gravity = 0.05;
  myScore = new component("30px", "Consolas", "black", 10, 40, "text");
  track.push([0, 1000], [1, 500], [0, 1000], [-2, 500], [0, 2000], [1, 500]);
  myGameArea.start();
}

var myGameArea = {
  canvas : document.createElement("canvas"),
  start : function() {
    this.canvas.width = 540; this.canvas.height = 540;
    this.context = this.canvas.getContext("2d");
    document.body.insertBefore(this.canvas, document.body.childNodes[0]);
    this.frameNo = 0;
    this.interval = setInterval(updateGameArea, 16); // ~60fps
  },
  clear : function() {
    this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
  }
};

function component(width, height, color, x, y, type) {
  this.type = type;
  this.score = 0;
  this.width = width;
  this.height = height;
  this.speedX = 0;
  this.speedY = 0;
  this.x = x;
  this.y = y;
  this.gravity = 0;
  this.gravitySpeed = 0;
  this.update = function() {
    var ctx = myGameArea.context;
    
    if (this.type == "text") {
      ctx.font = this.width + " " + this.height;
      ctx.fillStyle = color;
      ctx.fillText(this.text || "", this.x, this.y);
    } else {
      ctx.fillStyle = color;
      ctx.fillRect(this.x, this.y, this.width, this.height);
    }
  };
  this.newPos = function() {
    this.gravitySpeed += this.gravity;
    this.x += this.speedX;
    this.y += this.speedY + this.gravitySpeed;
    this.hitBottom();
  };
  this.hitBottom = function() {
    var rockbottom = myGameArea.canvas.height - this.height;
    if (this.y > rockbottom) { this.y = rockbottom; this.gravitySpeed = 0; }
  };
  this.move = function(n) { this.x += n; };
}

function updateGameArea() {
  myGameArea.clear();
  myGameArea.frameNo += 1;
  if (myGameArea.frameNo % 60 === 0) {
    console.log('frame', myGameArea.frameNo, 'testPiece?', !!testPiece, 'x,y=', testPiece && testPiece.x, testPiece && testPiece.y);
  }

  if (myGameArea.frameNo == 1 || everyinterval(10)) {
    var x = myGameArea.canvas.width;
    var y = myGameArea.canvas.height;
    distance += 10;

    if (distance - lastBillboardSpawnAt >= BILLBOARD_SPAWN_GAP) {
      lastBillboardSpawnAt = distance;
      spawnBillboard(distance + 500);
    }
    draw(myGameArea.canvas, distance);
  }

  for (var i = 0; i < trackLines.length; i++) { trackLines[i].update(); }
  drawBillboards();

  myScore.text = "SCORE: " + myGameArea.frameNo;
  myScore.update();
  myGamePiece.newPos();
  myGamePiece.update();

  /* draw testPiece last so it’s on top */
  if (testPiece) testPiece.update();
}

function everyinterval(n) { return (myGameArea.frameNo % n) === 0; }

function draw(canvas) {
  var x = canvas.width, y = canvas.height;
  var offset = 0, trackNumber = 0;

  while (trackNumber < track.length && offset <= distance) {
    offset += track[trackNumber][1];
    trackNumber++;
  }

  var targetCurvature = track[trackNumber - 1][0];
  var trackCurveDiff = (targetCurvature - curvature) * 0.01;
  curvature += trackCurveDiff;

  for (var j = 0; j < y / 2; j += 5) {
    var perspective = j / (y / 2);
    var middlePoint = x / 2 + curvature * 500 * Math.pow((1 - perspective), 2);
    var gap = 250 * perspective + 100;
    var color = Math.sin(20 * Math.pow(1 - perspective, 3) + distance * 0.1) > 0 ? "green" : "darkgreen";
    trackLines.push(new component(middlePoint - gap/2, 5, color, 0, y/2 + j));
    trackLines.push(new component(x - middlePoint + gap/2, 5, color, middlePoint + gap/2, y/2 + j));
  }
  while (trackLines.length > y/5) { trackLines.shift(); }
  if (distance > offset) distance = 0;
}

document.addEventListener("keypress", function(event) {
  if (event.keyCode == 97) myGamePiece.move(-5);
  else if (event.keyCode == 100) myGamePiece.move(5);
});
</script>

<br>
<p style="text-align:center">Use A / D to move.</p>
</body>
</html>
