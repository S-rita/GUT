<!DOCTYPE html>
<html>

canvas {

<body onload="startGame()">
<script>

const canvas_width = 1000;
const canvas_height = 540;

const controls = {
  left: false,
  right: false,
};

var speed = 2;
var myGamePiece;
var myObstacles = [];
var trackLines = []
var track = [];
var myScore;
var distance = 0;
var curvature = 0;

function startGame() {
    myGamePiece = new component(30, 30, "red", 270, 540);
    myScore = new component("30px", "Consolas", "black", 280, 40, "text");
    track.push([0, 100]);
    track.push([1, 500]);
    track.push([0, 1000]);
    track.push([-2, 500]);
    track.push([0, 2000]);
    track.push([1, 500]);
    myGameArea.start();
}

var myGameArea = {
    canvas : document.createElement("canvas"),
    start : function() {
        this.canvas.width = 540;
        this.canvas.height = 540;
        this.context = this.canvas.getContext("2d");
        document.body.insertBefore(this.canvas, document.body.childNodes[0]);
        this.frameNo = 0;
        this.interval = setInterval(updateGameArea, 1);
        },
    clear : function() {
        this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }
}

function component(width, height, color, x, y, spawnOffset=0, laneOffset=0) {
    this.score = 0;
    this.width = width;
    this.height = height;
    this.spawnOffset = spawnOffset;
    this.laneOffset = laneOffset;
    this.speedX = 0;
    this.speedY = 0;    
    this.x = x;
    this.y = y;
    this.update = function() {
        ctx = myGameArea.context;
        if (this.type == "text") {
            ctx.font = this.width + " " + this.height;
            ctx.fillStyle = color;
            ctx.fillText(this.text, this.x, this.y);
        } else {
            ctx.fillStyle = color;
            ctx.fillRect(this.x, this.y, this.width, this.height);
        }
    }
    this.newPos = function() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.hitBottom();
    }
    this.hitBottom = function() {
        var rockbottom = myGameArea.canvas.height - this.height;
        if (this.y > rockbottom) {
            this.y = rockbottom;
        }
    }
    this.move = function(n) {
        this.x += n;
    } 
    // this.crashWith = function(otherobj) {
    //     var myleft = this.x;
    //     var myright = this.x + (this.width);
    //     var mytop = this.y;
    //     var mybottom = this.y + (this.height);
    //     var otherleft = otherobj.x;
    //     var otherright = otherobj.x + (otherobj.width);
    //     var othertop = otherobj.y;
    //     var otherbottom = otherobj.y + (otherobj.height);
    //     var crash = true;
    //     if ((mybottom < othertop) || (mytop > otherbottom) || (myright < otherleft) || (myleft > otherright)) {
    //         crash = false;
    //     }
    //     return crash;
    // }
}

function updateGameArea() {
    // for (i = 0; i < myObstacles.length; i += 1) {
    //     if (myGamePiece.crashWith(myObstacles[i])) {
    //         return;
    //     } 
    // }
    myGameArea.clear();
    myGameArea.frameNo += 1;

    canvasHeight = myGameArea.canvas.height;
    canvasWidth = myGameArea.canvas.width;

    if (myGameArea.frameNo == 1 || everyinterval(5)) {
        x = myGameArea.canvas.width;
        y = myGameArea.canvas.height;
        distance += speed;
        draw(myGameArea.canvas)
    }
    for (i = 0; i < trackLines.length; i++) {
        trackLines[i].update();
    }

    if (everyinterval(2000)) {
        myObstacles.push(new component(30, 30, "red", 270, 240, -15, -100))
    }

    console.log("curve", curvature);
    for (let i = 0; i < myObstacles.length; i++) {
        const halfH = canvasHeight / 2;
        let perspective = (myObstacles[i].y - halfH) / halfH;
        
        const middlePointObs = canvasWidth / 2 + myObstacles[i].spawnOffset + curvature * 500 * Math.pow(1 - perspective, 2);

        myObstacles[i].y += speed * 0.1;
        const laneDrift = myObstacles[i].laneOffset * (paaerspective);
        
        myObstacles[i].x = middlePointObs + laneDrift;

        myObstacles[i].update();
    }

  // player movement
  if (controls.left) {
    myGamePiece.move(-5);
  }
  if (controls.right) {
    myGamePiece.move(5);
  }

  scoreboard.text = "SCORE: " + score;
  scoreboard.update();
  myGamePiece.newPos();
  // myGamePiece.update();
  myGameArea.canvas
    .getContext("2d")
    .drawImage(
      document.getElementById("car"),
      myGamePiece.x,
      myGamePiece.y - 150,
      150,
      150
    );
}

function everyinterval(n) {
    if ((myGameArea.frameNo / n) % 1 == 0) {return true;}
    return false;
}

function draw(canvas) {
    x = canvas.width;
    y = canvas.height;
    
    offset = 0;
    trackNumber = 0;

    while (trackNumber < track.length && offset <= distance) {
        offset += track[trackNumber][1];
        trackNumber++;
    }

    targetCurvature = track[trackNumber - 1][0];
    
    trackCurveDiff = (targetCurvature - curvature) * 0.01;
    curvature += trackCurveDiff;

    for (j = 0; j < y / 2; j+=5) {

        perspective = j / (y / 2);
        middlePoint = x / 2 + curvature * 500 * Math.pow((1 - perspective), 2);
    
        gap = 250 * perspective + 100;

        if (j == 0) {
            middleValue = middlePoint;
        }

        color = Math.sin(20 * Math.pow(1 - perspective, 3) + distance * 0.1) > 0 ? "green" : "darkgreen";
        trackLines.push(new component(middlePoint - gap/2, 5, color, 0, y/2 + j));
        trackLines.push(new component(x - middlePoint + gap/2, 5, color, middlePoint + gap/2, y/2 + j));
    } 
    while (trackLines.length > y/5) {
        trackLines.shift();
    }
    
    if (distance > offset) distance = 0;
}

document.addEventListener("keypress", function(event) {
  if (event.keyCode == 97) {
    myGamePiece.move(-5)
  } else if (event.keyCode == 100) {
    myGamePiece.move(5)
  }
});


</script>
<br>
